    <link rel="stylesheet" href="css/estilos.css">

    <title>Inscripción</title>
</head>
<body>


<nav class="navbar navbar-expand-md bg-dark navbar-dark py-2">
    <div class="container-fluid align-items-center">

        <a href="index.html" class="navbar-brand align-items-center m-2 ">

            </span>

        <button class="navbar-toggler " type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
            <span class="navbar-toggler-icon"></span>

        <div class="collapse navbar-collapse" id="navmenu">
            <ul class="navbar-nav align-items-md-center pt-4 pt-md-0 ">

                    <a href="inscripcion.html" class="nav-link">Inscripciones</a>
                </li>
            </ul>
        </div>

    </div>
</nav>


<div class="container py-5">
    <h1 id="inscripcion" class="text-center fw-bold mb-2">Inscripción</h1>
    <div class="bg-dark mx-auto mb-4" style="width: 50px; height: 3px; border-radius: 2px;"></div>

    <form class="p-4 bg-light rounded-3 shadow-sm border">
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label for="inputNombre" class="form-label fw-semibold">Nombre</label>
                <input type="text" id="inputNombre" class="form-control" placeholder="Ingrese nombre" required>
            </div>
            <div class="col-md-6">
                <label for="inputApellido" class="form-label fw-semibold">Apellido</label>
                <input type="text" id="inputApellido" class="form-control" placeholder="Ingrese apellido" required>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-5">
                <label for="inputEmail" class="form-label fw-semibold">Correo Electrónico</label>
                <input type="email" id="inputEmail" class="form-control" placeholder="usuario@gmail.com" required>
            </div>
            <div class="col-md-4">
                <label for="inputTelefono" class="form-label fw-semibold">Teléfono</label>
                <div class="input-group">
                    <span class="input-group-text">+56</span>
                    <input type="tel" id="inputTelefono" class="form-control" placeholder="9 1234 5678">
                </div>
            </div>
            <div class="col-md-3">
                <label for="inputEdad" class="form-label fw-semibold">Edad</label>
                <input type="number" id="inputEdad" class="form-control" min="0" max="120" placeholder="Ingrese edad">
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-semibold d-block">Actividades de Interés (Selecciona una o más)</label>
            <div class="row g-2 p-3 bg-white rounded border">
                <div class="col-6 col-md-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="act1" value="recorridos">
                        <label class="form-check-label" for="act1">Recorridos Guiados</label>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="act2" value="gastronomia">
                        <label class="form-check-label" for="act2">Gastronomía</label>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="act3" value="arte">
                        <label class="form-check-label" for="act3">Artes Visuales</label>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="act4" value="cine">
                        <label class="form-check-label" for="act4">Cine y Cineteca</label>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="act5" value="talleres">
                        <label class="form-check-label" for="act5">Talleres de Creación</label>
                    </div>
                </div>
                <div class="col-6 col-md-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="act6" value="ferias">
                        <label class="form-check-label" for="act6">Ferias y Ediciones</label>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <label for="inputComentarios" class="form-label fw-semibold">Comentarios Adicionales</label>
            <textarea id="inputComentarios" class="form-control" rows="3" placeholder="Ingrese comentario"></textarea>
        </div>

        <div class="form-check mb-4">
            <input type="checkbox" class="form-check-input" id="checkCondiciones" required>
            <label class="form-check-label text-secondary small" for="checkCondiciones">
                Acepto las condiciones de participación y políticas de privacidad.
            </label>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Enviar Inscripción</button>
    </form>
</div>



<!-- Footer -->
<footer class="bg-dark text-light py-5 px-3">
    <div class="container">
        <div class="row align-items-center gy-4">
            
            <div class="col-12 col-lg-6 d-flex flex-column align-items-center align-items-lg-start gap-3">
                <div class="d-flex align-items-center">
                    <i class="bi bi-phone text-light fs-3 me-2"></i>
                    <span class="fw-bold fs-5">+56 1 23 456 789</span>
                </div>

                <div class="d-flex align-items-center text-center text-lg-start">
                    <i class="bi bi-geo-alt-fill text-light fs-4 me-2"></i>
                    <span class="fw-bold fs-6">Teniente Merino 1050, Puerto Aysén.</span>
                </div>
            </div>

            <div class="col-12 col-lg-6 d-flex flex-column flex-sm-row align-items-center justify-content-center justify-content-lg-end gap-3">
                <h3 class="mb-0 fs-5 text-center text-lg-start">Visita Nuestras Redes Sociales</h3>
                
                <div class="d-flex gap-3">
                    <a href="https://twitter.com" class="icon-link text-decoration-none" aria-label="Twitter">
                        <div class="h3 mb-0">
                            <i class="bi bi-twitter-x text-light"></i>
                        </div>
                    </a>

                    <a href="https://facebook.com" class="icon-link text-decoration-none" aria-label="Facebook">
                        <div class="h3 mb-0">
                            <i class="bi bi-facebook text-light"></i>
                        </div>
                    </a>

                    <a href="https://instagram.com" class="icon-link text-decoration-none" aria-label="Instagram">
                        <div class="h3 mb-0">
                            <i class="bi bi-instagram text-light"></i>
                        </div>
                    </a>

                    <a href="https://tiktok.com" class="icon-link text-decoration-none" aria-label="TikTok">
                        <div class="h3 mb-0">
                            <i class="bi bi-tiktok text-light"></i>
                        </div>
                    </a>
                </div>
            </div>

        </div>
    </div>
</footer>



<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
