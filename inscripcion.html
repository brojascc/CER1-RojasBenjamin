<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/bootstrap.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <title>Inscripción</title>
</head>
<body>

<nav class="navbar navbar-expand-md bg-dark navbar-dark py-1 fixed-top">
    <div class="container-fluid">
        <a href="principal.html" class="navbar-brand">
            <img src="img/Logo puerto abierto.jpg" alt="" width="80" height="80">
        </a>

        <button 
        class="navbar-toggler" 
        type="button" 
        data-bs-toggle="collapse" 
        data-bs-target="#navmenu">
        <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navmenu">
            <ul class="navbar-nav ms-right">
                <li class="nav-item">
                    <a href="cartelera.html" class="nav-link">Actividades</a>
                </li>
                <li class="nav-item">
                    <a href="inscripcion.html" class="nav-link">Inscripciones</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<section class="bg-dark p-5 g-5"></section>

<div class="container justify-content-between align-items-center py-5">
    <h1 id="inscripcion" class="text-center py-3">Inscripción</h1> 

    <form class="mx-5">
    <div class="mb-3">
        <div class="input-group">
        <span class="input-group-text">Nombres</span>
        <input type="text" aria-label="nombre" class="form-control">
        <span class="input-group-text">Apellidos</span>
        <input type="text" aria-label="apellido" class="form-control">
        </div>

        <label for="exampleInputEmail1" class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control"  aria-describedby="email" placeholder="usuario@gmail.com">

        <label for="exampleInputEmail1" class="form-label">Teléfono</label>

        <div class="input-group">
        <span class="input-group-text">+</span>
        <input type="text" aria-label="telefono" class="form-control" placeholder="123 123 123">
        </div>


        <label for="exampleInputEmail1" class="form-label">Actividad de Interés</label>
        <select class="form-select">
            <option value="1">Recorrido</option>
            <option value="2">Gastronómicas</option>
            <option value="3">Arte</option>
        </select>

        <label for="inputEdad" class="form-label">Edad</label>
        <input type="number" id="ageInput" class="form-control" min="0" max="120" placeholder="Ingrese edad">


        <div class="input-group">
        <span class="input-group-text">Comentarios Adicionales</span>
        <textarea class="form-control" aria-label="With textarea"></textarea>
        </div>

    </div>

    <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="exampleCheck1">
        <label class="form-check-label" for="exampleCheck1">Acepta Condiciones de Participación</label>
    </div>

    <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
</div>


<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    
</body>
</html>
